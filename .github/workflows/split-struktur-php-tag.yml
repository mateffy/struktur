name: Sync tag to struktur-php

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  sync-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push tag to struktur-php mirror
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}

          git remote add mirror https://x-access-token:${{ secrets.SPLIT_TOKEN }}@github.com/mateffy/struktur-php.git

          # Push main from the subtree
          git subtree push --prefix=packages/struktur-php mirror main

          # Push the same tag to the mirror
          git push mirror "$TAG_NAME:refs/tags/$TAG_NAME"
