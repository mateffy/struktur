name: Sync tag to struktur-php

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  sync-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push tag to struktur-php mirror
        run: |
          MIRROR="https://x-access-token:${{ secrets.SPLIT_TOKEN }}@github.com/mateffy/struktur-php.git"

          SPLIT=$(git subtree split --prefix=packages/struktur-php)
          git push "$MIRROR" "$SPLIT:refs/heads/main" --force

          # Push tag if triggered by a tag event
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            git push "$MIRROR" "$SPLIT:refs/tags/$TAG_NAME"
          fi
