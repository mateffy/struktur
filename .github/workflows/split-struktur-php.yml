name: Split struktur-php

on:
  push:
    branches: [main]
    paths:
      - "packages/struktur-php/**"

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to struktur-php mirror
        run: |
          MIRROR="https://x-access-token:${{ secrets.SPLIT_TOKEN }}@github.com/mateffy/struktur-php.git"

          SPLIT=$(git subtree split --prefix=packages/struktur-php)
          git push "$MIRROR" "$SPLIT:refs/heads/main" --force
