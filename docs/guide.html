<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Redirecting to Documentation · Struktur</title>
        <meta http-equiv="refresh" content="0; url=./tutorials/quickstart.html" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./assets/style.css" />
        <style>
            .redirect-container {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 2rem;
            }
            .redirect-title {
                font-size: 1.5rem;
                margin-bottom: 1rem;
            }
            .redirect-message {
                color: var(--text-secondary);
                margin-bottom: 2rem;
            }
            .redirect-link {
                color: var(--accent);
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="redirect-container">
            <h1 class="redirect-title">Documentation Moved</h1>
            <p class="redirect-message">
                The documentation has been reorganized. You are being redirected to the 
                <a class="redirect-link" href="./tutorials/quickstart.html">Quickstart tutorial</a>.
            </p>
            <p style="font-size: 0.8rem; color: var(--text-muted);">
                If you are not redirected automatically, 
                <a href="./tutorials/quickstart.html">click here</a>.
            </p>
        </div>
    </body>
</html>
